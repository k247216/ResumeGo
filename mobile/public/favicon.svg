<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- 与 android/app/src/main/res/drawable/ic_launcher_{background,fg}.xml 同一套几何，
       保证浏览器标签页上的图标和手机主屏图标是同一个。 -->
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BC594"/>
      <stop offset=".45" stop-color="#149276"/>
      <stop offset="1" stop-color="#0A5340"/>
    </linearGradient>
    <radialGradient id="hi" cx="76" cy="22" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="108" height="108" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <circle cx="54" cy="54" r="41" fill="none" stroke="#FFFFFF" stroke-opacity=".075" stroke-width="13"/>
    <rect width="108" height="108" fill="url(#hi)"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M30,80 L46,80"/>
    <path d="M41,61 L59,61"/>
    <path d="M52,42 L70,42"/>
  </g>
  <circle cx="77" cy="31" r="6.6" fill="#FFFFFF"/>
</svg>
