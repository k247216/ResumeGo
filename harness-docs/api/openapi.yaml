          type: [string, "null"]
          maxLength: 200
        rawText:
          type: string
          minLength: 20
          maxLength: 50000

    ParsedJobDescription:
      type: object
      additionalProperties: false
      required:
        - requiredSkills
        - preferredSkills
        - responsibilities
        - experienceRequirements
        - educationRequirements
      properties:
        requiredSkills:
          type: array
          uniqueItems: true
          items:
            type: string
        preferredSkills:
          type: array
          uniqueItems: true
          items:
            type: string
        responsibilities:
          type: array
          items:
            type: string
        experienceRequirements:
          type: array
          items:
            type: string
        educationRequirements:
          type: array
          items:
            type: string

    JobDescription:
      type: object
      additionalProperties: false
      required:
        [id, jobTitle, rawText, parseStatus, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        jobTitle:
          type: string
        companyName:
          type: [string, "null"]
        rawText:
          type: string
        parsed:
          oneOf:
            - $ref: "#/components/schemas/ParsedJobDescription"
