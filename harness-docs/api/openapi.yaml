openapi: 3.1.0

info:
  title: 职达 Sprint 1—3 API
  version: 0.3.0-draft
  description: |
    职达 Sprint 1—3 核心闭环 API 评审草案。

    本文档由 AI 辅助整理，必须由三名成员人工审阅和修改后才能标记为 Accepted。
    当前阶段使用固定演示用户，不提供注册登录和文件上传。

servers:
  - url: http://localhost:8080
    description: 本地开发环境

tags:
  - name: System
  - name: Evidence
  - name: Resume
  - name: Job
  - name: Assessment
  - name: Matching
  - name: Optimization
  - name: Interview

paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: 服务健康检查
      operationId: healthCheck
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/evidences:
    post:
      tags: [Evidence]
      summary: 创建能力证据
      operationId: createEvidence
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Evidence]
      summary: 查询演示用户的能力证据
      operationId: listEvidences
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceListResponse"

  /api/v1/evidences/{evidenceId}:
    get:
      tags: [Evidence]
      summary: 查询一条能力证据
      operationId: getEvidence
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Evidence]
      summary: 修改能力证据
      operationId: updateEvidence
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/EvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvidenceRequest"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/resumes:
    post:
      tags: [Resume]
      summary: 创建简历及首个版本
      operationId: createResume
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResumeRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/resumes/{resumeId}:
    get:
      tags: [Resume]
      summary: 查询简历及当前版本
      operationId: getResume
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/resumes/{resumeId}/versions:
    get:
      tags: [Resume]
      summary: 查询简历版本列表
      operationId: listResumeVersions
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ResumeId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeVersionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/resume-versions/{versionId}:
    get:
      tags: [Resume]
      summary: 查询不可变简历版本
      operationId: getResumeVersion
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/job-descriptions:
    get:
      tags: [Job]
      summary: 查询当前演示用户的 JD 列表
      operationId: listJobDescriptions
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDescriptionListResponse"

    post:
      tags: [Job]
      summary: 创建原始 JD
      operationId: createJobDescription
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobDescriptionRequest"
      responses:
        "201":
          description: 创建成功，尚未解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDescriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/job-descriptions/{jobDescriptionId}:
    get:
      tags: [Job]
      summary: 查询单个 JD
      operationId: getJobDescription
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/JobDescriptionId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDescriptionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/job-descriptions/{jobDescriptionId}/parse:
    post:
      tags: [Job]
      summary: 使用千问 Max 解析 JD
      description: |
        模型只负责把原始 JD 转换为符合 Schema 的岗位要求。解析结果是匹配算法的输入，
        不能直接成为岗位匹配分数。
      operationId: parseJobDescription
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/JobDescriptionId"
      responses:
        "200":
          description: 解析成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDescriptionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/AiOutputInvalid"
        "503":
          $ref: "#/components/responses/AiUnavailable"

  /api/v1/resume-versions/{versionId}/assessments:
    post:
      tags: [Assessment]
      summary: 执行简历多维度评分
      description: |
        AI 禁飞区接口。最终分数、权重、扣分和归一化必须由成员 1 手写的确定性程序完成。
      operationId: assessResumeVersion
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: 评分成功；相同输入和规则版本允许返回已存在结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"

  /api/v1/resume-versions/{versionId}/job-matches:
    post:
      tags: [Matching]
      summary: 计算简历版本与岗位的匹配结果
      description: |
        AI 禁飞区接口。千问解析后的岗位标签只能作为输入，最终相似度和排序规则由成员 2
        手写的确定性程序完成。

        接口采用嵌套资源路径：匹配是简历版本的子资源。
        相同输入重复请求返回已有结果（幂等）。
      operationId: createJobMatch
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "200":
          description: 匹配成功；相同输入和算法版本允许返回已存在结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"

  /api/v1/job-matches/{matchId}:
    get:
      tags: [Matching]
      summary: 查询已有匹配结果
      description: 根据匹配 ID 获取历史匹配记录。
      operationId: getJobMatch
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/job-matches/{matchId}/suggestions:
    post:
      tags: [Optimization]
      summary: 使用千问 Max 生成一次定向修改建议
      description: |
        建议必须引用能力证据。没有证据时只能返回 evidence_required，不得编造经历或数字。
      operationId: generateOptimizationSuggestions
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/MatchId"
      responses:
        "201":
          description: 建议生成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/AiOutputInvalid"
        "503":
          $ref: "#/components/responses/AiUnavailable"

  /api/v1/optimization-suggestions/{suggestionId}/accept:
    post:
      tags: [Optimization]
      summary: 采纳建议并创建新简历版本
      operationId: acceptOptimizationSuggestion
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SuggestionId"
      responses:
        "201":
          description: 采纳成功并创建新版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRuleViolation"

  /api/v1/optimization-suggestions/{suggestionId}/reject:
    post:
      tags: [Optimization]
      summary: 拒绝一条建议
      operationId: rejectOptimizationSuggestion
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/SuggestionId"
      responses:
        "200":
          description: 拒绝成功，简历版本不发生变化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/interview-plans:
    post:
      tags: [Interview]
      summary: 创建一次多轮模拟面试计划
      description: |
        创建 plan 级面试容器，并为每位面试官创建一个 session。计划层只组织轮次，
        不负责状态机转换。
      operationId: createInterviewPlan
      responses:
        "201":
          description: 创建成功
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/interview-plans/my:
    get:
      tags: [Interview]
      summary: 查询当前演示用户的多轮面试计划
      operationId: listMyInterviewPlans
      responses:
        "200":
          description: 查询成功

  /api/v1/interview-plans/{planId}:
    get:
      tags: [Interview]
      summary: 查询一次多轮面试计划详情
      operationId: getInterviewPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: 查询成功
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Interview]
      summary: 从历史列表隐藏一次多轮面试计划
      description: |
        使用 deleted_at 软删除计划历史入口，不物理删除面试问答数据。
      operationId: hideInterviewPlan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: 隐藏成功
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/interview-plans/{planId}/summary:
    post:
      tags: [Interview]
      summary: 生成一次多轮面试的整次复盘
      description: |
        只有 plan 下所有 session 均为 COMPLETED 时才允许生成。生成结果写入
        interview_plans.summary_json，并触发成长趋势快照写入。
      operationId: generateInterviewPlanSummary
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: 复盘生成成功
        "400":
          $ref: "#/components/responses/BusinessRuleViolation"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/interview-growth:
    get:
      tags: [Interview]
      summary: 查询某份简历在某个岗位下的面试成长趋势
      description: |
        返回后端持久化的 interview_growth_snapshots。成长趋势只用于复盘展示，
        不参与简历评分、岗位匹配排序或录用概率判断。
      operationId: getInterviewGrowthReport
      parameters:
        - name: resumeId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - name: jobDescriptionId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: 查询成功
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端可传入的请求关联 ID；缺失时由服务端生成
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 采纳建议的幂等键
      schema:
        type: string
        minLength: 8
        maxLength: 100
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    JobDescriptionId:
      name: jobDescriptionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在或不属于当前演示用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 当前状态不允许该操作或发生版本冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BusinessRuleViolation:
      description: 业务规则校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiOutputInvalid:
      description: AI 返回内容未通过结构化校验
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiUnavailable:
      description: 模型超时、限流或供应商暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1

    Timestamp:
      type: string
      format: date-time

    EvidenceType:
      type: string
      enum: [project, internship, competition, skill, other]

    SuggestionStatus:
      type: string
      enum: [pending, accepted, rejected, evidence_required]

    ParseStatus:
      type: string
      enum: [pending, succeeded, failed]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: UP
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    ApiMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string

    CreateEvidenceRequest:
      type: object
      additionalProperties: false
      required: [type, title, action, skillTags]
      properties:
        type:
          $ref: "#/components/schemas/EvidenceType"
        title:
          type: string
          minLength: 1
          maxLength: 200
        situation:
          type: [string, "null"]
          maxLength: 5000
        action:
          type: string
          minLength: 1
          maxLength: 10000
        result:
          type: [string, "null"]
          maxLength: 5000
        skillTags:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        sourceNote:
          type: [string, "null"]
          maxLength: 500

    UpdateEvidenceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          $ref: "#/components/schemas/EvidenceType"
        title:
          type: string
          minLength: 1
          maxLength: 200
        situation:
          type: [string, "null"]
          maxLength: 5000
        action:
          type: string
          minLength: 1
          maxLength: 10000
        result:
          type: [string, "null"]
          maxLength: 5000
        skillTags:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        sourceNote:
          type: [string, "null"]
          maxLength: 500

    Evidence:
      allOf:
        - $ref: "#/components/schemas/CreateEvidenceRequest"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            createdAt:
              $ref: "#/components/schemas/Timestamp"
            updatedAt:
              $ref: "#/components/schemas/Timestamp"

    PersonalInfo:
      type: object
      additionalProperties: false
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
          maxLength: 30
        city:
          type: [string, "null"]
          maxLength: 100

    EducationItem:
      type: object
      additionalProperties: false
      required: [school, major]
      properties:
        school:
          type: string
          minLength: 1
          maxLength: 200
        major:
          type: string
          minLength: 1
          maxLength: 200
        degree:
          type: [string, "null"]
          maxLength: 100
        startDate:
          type: [string, "null"]
          format: date
        endDate:
          type: [string, "null"]
          format: date

    ResumeExperience:
      type: object
      additionalProperties: false
      required: [sectionKey, evidenceId, title, bullets]
      properties:
        sectionKey:
          type: string
          minLength: 1
          maxLength: 100
        evidenceId:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          minLength: 1
          maxLength: 200
        bullets:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 1000

    ResumeContent:
      type: object
      additionalProperties: false
      required: [personalInfo, education, experiences, skills]
      properties:
        personalInfo:
          $ref: "#/components/schemas/PersonalInfo"
        education:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/EducationItem"
        experiences:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ResumeExperience"
        skills:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100

    CreateResumeRequest:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          $ref: "#/components/schemas/ResumeContent"

    ResumeVersion:
      type: object
      additionalProperties: false
      required:
        [id, resumeId, versionNo, content, createdByType, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        resumeId:
          $ref: "#/components/schemas/Id"
        parentVersionId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        versionNo:
          type: integer
          minimum: 1
        content:
          $ref: "#/components/schemas/ResumeContent"
        changeSummary:
          type: [string, "null"]
          maxLength: 500
        createdByType:
          type: string
          enum: [user, ai_suggestion, import]
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    Resume:
      type: object
      additionalProperties: false
      required: [id, title, currentVersion, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        currentVersion:
          $ref: "#/components/schemas/ResumeVersion"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"

    CreateJobDescriptionRequest:
      type: object
      additionalProperties: false
      required: [jobTitle, rawText]
      properties:
        jobTitle:
