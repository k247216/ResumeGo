services:
  mysql:
    image: mysql:8.0
    container_name: resumego-mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: resumego
      MYSQL_USER: resumego
      MYSQL_PASSWORD: ${DB_PASSWORD:-resumego123}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
