name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Compile electron main + preload
        run: npm run build:electron
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run backend tests
        run: mvn -B test
        working-directory: backend

  desktop-pack:
    name: Desktop pack (Windows portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build desktop package (backend jar + frontend dist + electron + jlink runtime)
        run: npm run desktop:pack:win
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke-test packaged backend (jlink runtime + H2 health check)
        shell: pwsh
        run: |
          $dbDir = Join-Path $env:RUNNER_TEMP 'smoke-workspace'
          New-Item -ItemType Directory -Force -Path $dbDir | Out-Null
          $env:SPRING_PROFILES_ACTIVE = 'local'
          $env:RESUMEGO_DB_PATH = Join-Path $dbDir 'resumego'
          $java = Join-Path (Get-Location) 'output/desktop/win-unpacked/resources/runtime/bin/java.exe'
          $jar = Join-Path (Get-Location) 'output/desktop/win-unpacked/resources/backend/resume-go.jar'
          Write-Host "java=$java exists=$(Test-Path $java) jar=$jar exists=$(Test-Path $jar)"
          $proc = Start-Process -FilePath $java -ArgumentList '-jar', $jar, '--spring.profiles.active=local', '--server.port=18777' -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $resp = Invoke-RestMethod -Uri 'http://127.0.0.1:18777/actuator/health' -TimeoutSec 2
                if ($resp.status -eq 'UP') { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Backend health check failed' }
            Write-Host 'Backend smoke test PASSED'
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResumeGo-windows-portable
          path: output/desktop/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release (v* tags)
    runs-on: ubuntu-latest
    needs: [desktop-pack]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ResumeGo-windows-portable
      - name: Find exe
        run: |
          echo "EXE=$(find . -name '*.exe' | head -1 | xargs -I{} basename {})" >> $GITHUB_ENV
          ls -la
      - name: Read tag message for release notes
        shell: bash
        run: |
          git tag -l --format='%(contents)' ${{ github.ref_name }} > release-notes.md
          echo "notes bytes: $(wc -c < release-notes.md)"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ResumeGo ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ./*.exe
          draft: false
          prerelease: false
