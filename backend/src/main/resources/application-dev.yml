server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: 12345

spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/resumego?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:resumego}
    password: ${DB_PASSWORD:resumego123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ai:
  endpoint: ${AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1}
  model: ${AI_MODEL:qwen-max}
  api-key: ${AI_API_KEY:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.resumego: debug

resumego:
  security:
    workspace-token: ${LOCAL_WORKSPACE_TOKEN:resumego-local-workspace}
